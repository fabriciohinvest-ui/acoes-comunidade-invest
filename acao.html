<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ação · Comunidade Invest</title>
<style>
/* ==== TEMA: troque so estas cores para aplicar a identidade do site ==== */
:root{
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --bg:#f6f6f6;--s:#fff;--s2:#f0f0f0;--line:#e0e0e0;--fg:#1a1a1a;--mu:#6b6b6b;--ac:#2b2b2b;--on-ac:#fff;--soft:#ececec;--ac2:#8a8a8a;
  --up:#b3261e;--upsoft:#f8e5e3;--down:#1e7a46;--downsoft:#e2f2e8;
  --c1:#2b3a55;--c2:#1e7a46;--c3:#d08a1e;--c4:#7fb04a;--c5:#3d6fb5;--c6:#8e5ba8;--c7:#c2577a;--c8:#5aa5a0;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);font-family:var(--font);color:var(--fg);line-height:1.45}
button,select,input{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 60px}
.num{font-variant-numeric:tabular-nums}
/* topo fixo com as secoes */
.bar{position:sticky;top:0;z-index:5;background:var(--ac);color:var(--on-ac)}
.bar .in{max-width:1120px;margin:0 auto;padding:0 20px;display:flex;gap:16px;align-items:center;height:46px;overflow-x:auto;scrollbar-width:none}
.bar .in::-webkit-scrollbar{display:none}
.bar b{white-space:nowrap}.bar a{white-space:nowrap;text-decoration:none;font-size:14px;opacity:.85}.bar a:hover{opacity:1}
.hd{padding:26px 0 8px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:flex-end}
.logo{width:52px;height:52px;border-radius:14px;background:var(--ac);color:var(--on-ac);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.hd h1{font-size:30px;line-height:1.1}.hd .sub{color:var(--mu);font-size:14.5px;margin-top:3px}
.kp{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
.kp div{background:var(--s);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kp span{display:block;font-size:12px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kp b{display:block;font-size:22px;margin-top:2px}
.sec{background:var(--s);border:1px solid var(--line);border-radius:16px;margin-top:20px;overflow:hidden;scroll-margin-top:56px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line)}
.sh h2{font-size:16px;text-transform:uppercase;letter-spacing:.04em}
.sb{padding:18px 20px}
.seg{display:inline-flex;gap:3px;background:var(--s2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600}
.seg button.on{background:var(--ac);color:var(--on-ac)}
select.sel{border:1px solid var(--line);border-radius:10px;background:var(--s);padding:6px 10px;font-size:13.5px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grp{border-left:3px solid var(--ac);padding-left:14px;margin-top:20px}.grp:first-child{margin-top:0}
.grp h3{font-size:17px;font-weight:600;margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cd{background:var(--s2);border-radius:10px;padding:10px 12px;cursor:pointer;border:1.5px solid transparent;text-align:left}
.cd:hover{border-color:var(--line)}.cd.on{border-color:var(--ac)}
.cd .k{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mu);gap:6px;min-height:32px}
.cd .k i{font-style:normal;color:var(--ac2)}
.cd .v{font-size:19px;font-weight:650;margin-top:2px;display:flex;justify-content:space-between;align-items:center}
.cd .v small{font-size:11px;color:var(--ac2);font-weight:400}
.ihist{margin-top:14px;background:var(--s2);border-radius:12px;padding:12px 14px}
.ihist h4{font-size:14px;display:flex;justify-content:space-between}
.tw{overflow-x:auto;margin-top:6px}
table.t{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
table.t th{font-size:12.5px;color:var(--mu);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line)}
table.t td.r,table.t th.r{text-align:right}
table.t tbody tr:nth-child(odd) td{background:var(--s2)}
table.t td:first-child,table.t th:first-child{position:sticky;left:0;background:var(--s);z-index:1}
table.t tbody tr:nth-child(odd) td:first-child{background:var(--s2)}
table.t .ind td:first-child{padding-left:26px;font-weight:400}
table.t .tot td{font-weight:650}
.box2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.box2 div{background:var(--s2);border-radius:12px;padding:12px 16px}.box2 span{font-size:13px;color:var(--mu)}.box2 b{display:block;font-size:22px;font-weight:600}
.pg{display:flex;gap:4px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.pg button{border:1px solid var(--line);background:var(--s);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px}.pg button.on{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.radar{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:640px;margin-top:12px}
.radar div{border-radius:8px;padding:9px 0;text-align:center;font-size:14px;background:var(--s2);color:var(--mu)}
.radar div.on{background:var(--downsoft);color:var(--down);font-weight:650}
.inf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.inf div{border:1px solid var(--line);border-radius:10px;padding:10px 14px}.inf span{display:block;font-size:12.5px;color:var(--mu)}.inf b{font-size:16px;font-weight:600}
.chart{position:relative}.chart svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--ac);color:var(--on-ac);font-size:12.5px;border-radius:8px;padding:6px 9px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:3}
.lg{display:flex;justify-content:center;gap:6px 18px;flex-wrap:wrap;font-size:13px;color:var(--mu);margin-bottom:6px}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.note{font-size:12.5px;color:var(--mu);margin-top:10px}
.pos{color:var(--down)}.neg{color:var(--up)}
footer{font-size:12.5px;color:var(--mu);margin-top:24px}footer p+p{margin-top:6px}
.legal{border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin-top:10px}
.load{padding:80px 0;text-align:center;color:var(--mu)}
.bar a.volta{opacity:1;font-weight:600;border-right:1px solid rgba(255,255,255,.25);padding-right:14px}
.bmini{position:relative;min-width:240px}.bmini input{width:100%;border:1.5px solid var(--line);background:var(--s);border-radius:12px;padding:9px 12px 9px 34px;font-size:14.5px;outline:none}
.bmini input:focus{border-color:var(--ac)}.bmini svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ac2)}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--s);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:10;overflow:hidden;display:none}
.sug a{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;text-decoration:none;font-size:14px}.sug a:hover,.sug a.on{background:var(--s2)}.sug small{color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:760px){.bmini{min-width:0;width:100%}}
/* previa: secao fechada mostra so o comeco; botao "Ver mais" abre o resto */
.sec.fechado .gs .grp:nth-child(n+2),.sec.fechado #pg{display:none}
.sec.fechado.l3 tbody tr:nth-child(n+4),.sec.fechado.l4 tbody tr:nth-child(n+5),.sec.fechado.l5 tbody tr:nth-child(n+6),.sec.fechado.l6 tbody tr:nth-child(n+7){display:none}
.sec.fechado .sb{position:relative}.sec.fechado .sb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(transparent,var(--s));pointer-events:none}
@media (max-width:760px){.sec.fechado .gs .grp:first-child .cd:nth-child(n+7){display:none}}
.mais{display:block;width:100%;border:0;border-top:1px solid var(--line);background:var(--s);padding:12px;font-weight:650;font-size:14px;cursor:pointer;color:var(--fg)}.mais:hover{background:var(--s2)}
.divisor{margin:34px 0 0;font-size:20px;display:flex;align-items:center;gap:12px;scroll-margin-top:56px}.divisor::after{content:"";flex:1;height:1px;background:var(--line)}
.bar a{cursor:pointer}
.lg span{cursor:pointer;user-select:none;padding:2px 4px;border-radius:6px}.lg span:hover{background:var(--s2)}.lg span.off{opacity:.4;text-decoration:line-through}
.lgdica{text-align:center;font-size:11.5px;color:var(--ac2);margin:-2px 0 6px}
.aj{font-style:normal;color:var(--ac2);cursor:pointer;padding:0 3px;border-radius:50%}.aj:hover{color:var(--fg);background:var(--soft)}
#pop{position:absolute;z-index:30;max-width:330px;width:calc(100vw - 32px);background:var(--s);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px 14px 13px;font-size:14px;line-height:1.5;display:none}
#pop h4{font-size:14.5px;margin-bottom:4px;padding-right:22px}#pop button{position:absolute;top:6px;right:8px;border:0;background:none;font-size:18px;cursor:pointer;color:var(--mu)}
@media (max-width:760px){.wrap{padding:0 12px 48px}.kp{grid-template-columns:repeat(2,1fr)}.kp div:first-child{grid-column:1/-1}.inf{grid-template-columns:1fr 1fr}.box2{grid-template-columns:1fr}.sh,.sb{padding-left:14px;padding-right:14px}.hd h1{font-size:24px}.cards{grid-template-columns:1fr 1fr}.radar{grid-template-columns:repeat(4,1fr)}}

/* ---- extras: emojis, comunicados, comparacao, termometro, quedas, rosca ---- */
.inf div{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;align-items:center}.inf span,.inf b{grid-column:2;overflow-wrap:anywhere}
.inf .emo{grid-row:1/3;font-style:normal;font-size:19px;width:38px;height:38px;flex:none;border-radius:10px;background:var(--s2);display:grid;place-items:center;line-height:1}
.com{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 8px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;border-radius:8px}.com:hover{background:var(--s2)}
.com .dt{font-size:13px;color:var(--mu)}.com .ti b{display:block;font-weight:600;font-size:14.5px}.com .ti small{color:var(--mu);font-size:12.5px}
.com .ver{font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:4px 10px;white-space:nowrap}
.calc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 10px;font-size:15px}.calc input{width:120px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--s);color:var(--fg);font:inherit}
#cmpRes b{font-size:18px}
.cmpg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}.cmpg div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;column-gap:10px;align-items:center;background:var(--s2);border-radius:10px;padding:8px 12px;font-size:13.5px}
.cmpg i{width:10px;height:10px;border-radius:3px;grid-row:1/3}.cmpg b{font-size:15px}.cmpg small{grid-column:3;text-align:right;font-size:12px}
.trm{display:grid;grid-template-columns:190px 96px minmax(0,1fr);gap:4px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.trm:last-child{border-bottom:0}
.trm .nm small{display:block;color:var(--mu);font-size:12px;font-weight:400}.trm .tx{font-size:18px;font-weight:700}.trm .ds{grid-column:2/-1;font-size:13.5px;color:var(--mu)}.trm .ds b{color:var(--fg)}
.rg{position:relative;height:10px;border-radius:6px;background:var(--s2);border:1px solid var(--line);margin:8px 0 5px}
.rg i{position:absolute;top:-6px;width:5px;height:20px;border-radius:3px;background:var(--fg);transform:translateX(-50%)}.rg em{position:absolute;top:-3px;width:2px;height:14px;background:var(--mu);transform:translateX(-50%)}
.rgl{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--mu)}
.box2.b3{grid-template-columns:repeat(3,1fr)}.box2 small{display:block;font-size:12px;color:var(--mu)}
.rosca{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:center;margin-bottom:8px}.rosca svg{width:220px;height:220px}
.rl div{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.rl i{width:12px;height:12px;border-radius:3px}
@media (max-width:760px){.com{grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}.com .dt{grid-column:1/-1}.com .ver{grid-row:2;grid-column:2}
.trm{grid-template-columns:minmax(0,1fr) auto}.trm .rgw,.trm .ds{grid-column:1/-1}.box2.b3{grid-template-columns:1fr}.rosca{grid-template-columns:1fr;justify-items:center}.rosca .rl{width:100%}.inf{grid-template-columns:1fr;gap:8px}.inf div{padding:8px 12px}.inf .emo{width:32px;height:32px;font-size:16px}}
</style>

<div class="wrap" id="app"><div class="load">Carregando…</div></div>
<script src="config.js"></script>
<script>
/* ===== CONFIGURACAO =====
   DADOS_URL: endereco da pasta "dados" publicada pelo robo diario (GitHub Pages ou o servidor do site).
   A pagina abre a acao do endereco: acao.html?t=BBAS3  */
const DADOS_URL = (window.CI_DADOS_URL || 'dados/');
const PESQUISA = (window.CI_PAGINA_PESQUISA || 'index.html');  // pagina com a lista de todos os ativos
let T = (new URLSearchParams(location.search).get('t') || (/^#[A-Za-z]{4}\d{1,2}$/.test(location.hash) ? location.hash.slice(1) : '') || 'BBAS3').toUpperCase();

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const nf=(c)=>new Intl.NumberFormat('pt-BR',{minimumFractionDigits:c,maximumFractionDigits:c});
const N0=nf(0),N2=nf(2),N1=nf(1);
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
let A, M; // dados da acao; simbolo da moeda dos balancos
const isNum=v=>v!=null&&isFinite(v);
const grande=(v,sim)=>{if(!isNum(v))return'-';const a=Math.abs(v),s=v<0?'-':'';const p=sim?sim+' ':'';if(a>=1e12)return`${s}${p}${N2.format(a/1e12)} ${a/1e12<2?'Trilhão':'Trilhões'}`;if(a>=1e9)return`${s}${p}${N2.format(a/1e9)} ${a/1e9<2?'Bilhão':'Bilhões'}`;if(a>=1e6)return`${s}${p}${N2.format(a/1e6)} ${a/1e6<2?'Milhão':'Milhões'}`;return s+p+N2.format(a)};
const curto=v=>{if(!isNum(v))return'';const a=Math.abs(v),s=v<0?'-':'';return a>=1e12?s+N1.format(a/1e12)+'T':a>=1e9?s+N0.format(a/1e9)+'B':a>=1e6?s+N0.format(a/1e6)+'M':s+N1.format(a)};
const dBR=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'-';
const F={x:v=>isNum(v)?N2.format(v):'-',p:v=>isNum(v)?N2.format(v)+'%':'-',r:v=>isNum(v)?(M==='US$'?'US$ ':'R$ ')+N2.format(v):'-'};
const brl=v=>isNum(v)?'R$ '+N2.format(v):'-';

// ---------- grafico combinado (barras + linhas, 2 eixos, dica ao tocar) ----------
function chart(el,labels,todas,o={}){
  el._args=[labels,todas,o];const oc=el._ocultas||(el._ocultas=new Set());if(todas.every(s=>oc.has(s.nome)))oc.clear();const series=todas.filter(s=>!oc.has(s.nome));
  const box=el.clientWidth||900,W=Math.max(320,box),H=o.h||(W<600?260:320),pl=o.pl||52,pr=series.some(s=>s.eixo==='d')?52:14,pt=12,pb=28;
  const esq=series.filter(s=>s.eixo!=='d').flatMap(s=>s.vals).filter(isNum),dir=series.filter(s=>s.eixo==='d').flatMap(s=>s.vals).filter(isNum);
  const rng=(v,zero)=>{let mn=Math.min(...v,zero?0:Infinity),mx=Math.max(...v,zero?0:-Infinity);if(!v.length){mn=0;mx=1}if(mx===mn)mx=mn+1;if(!zero){const p=(mx-mn)*.08;mn-=p;mx+=p}return[mn,mx]};
  const temBarra=series.some(s=>s.tipo==='barra'&&s.eixo!=='d');
  const [a0,a1]=rng(esq,temBarra||o.zero),[b0,b1]=rng(dir,o.zeroD);
  const n=labels.length,cw=(W-pl-pr)/n,cx=i=>pl+cw*(i+.5),ya=v=>pt+(H-pt-pb)*(1-(v-a0)/(a1-a0)),yb=v=>pt+(H-pt-pb)*(1-(v-b0)/(b1-b0));
  let g='';
  for(let k=0;k<=4;k++){const v=a0+(a1-a0)*k/4,y=ya(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+4}" font-size="11" text-anchor="end" fill="var(--mu)">${(o.fmtE||curto)(v)}</text>`;
    if(dir.length){const vb=b0+(b1-b0)*k/4;g+=`<text x="${W-pr+6}" y="${y+4}" font-size="11" fill="var(--mu)">${(o.fmtD||curto)(vb)}</text>`}}
  const passo=Math.max(1,Math.ceil(n/(W<600?5:o.ticks||12)));
  labels.forEach((l,i)=>{if(n<20?(i===n-1||i%passo===0&&n-1-i>=passo):i%passo===0)g+=`<text x="${cx(i)}" y="${H-8}" font-size="11.5" text-anchor="middle" fill="var(--mu)">${l}</text>`});
  if(o.destaque!=null)g+=`<rect x="${pl+cw*o.destaque}" y="${pt}" width="${cw}" height="${H-pt-pb}" fill="var(--s2)"/>`;
  const bars=series.filter(s=>s.tipo==='barra'),nb=bars.length;
  bars.forEach((s,j)=>{const y=s.eixo==='d'?yb:ya;const bw=cw*.7/nb;s.vals.forEach((v,i)=>{if(!isNum(v))return;const x=pl+cw*i+cw*.15+bw*j,y0=y(Math.max(0,s.eixo==='d'?b0:a0)>0?(s.eixo==='d'?b0:a0):0);const yy=y(v);g+=`<rect x="${x}" y="${Math.min(yy,y0)}" width="${bw}" height="${Math.max(1,Math.abs(y0-yy))}" rx="3" fill="${typeof s.cor==='function'?s.cor(v):s.cor}"/>`})});
  series.filter(s=>s.tipo!=='barra').forEach(s=>{const y=s.eixo==='d'?yb:ya;let d='',on=0;s.vals.forEach((v,i)=>{if(!isNum(v)){on=0;return}d+=(on?'L':'M')+cx(i).toFixed(1)+' '+y(v).toFixed(1);on=1});
    g+=`<path d="${d}" fill="none" stroke="${s.cor}" stroke-width="${s.w||2.2}" stroke-linejoin="round"/>`;if(n<=30)s.vals.forEach((v,i)=>{if(isNum(v))g+=`<circle cx="${cx(i)}" cy="${y(v)}" r="3" fill="var(--s)" stroke="${s.cor}" stroke-width="1.6"/>`})});
  g+=`<line id="cur" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="var(--ac2)" stroke-dasharray="3 3" visibility="hidden"/>`;
  el.innerHTML=(o.legenda===false?'':`<div class="lg">${todas.map(s=>`<span data-lg="${s.nome}" class="${oc.has(s.nome)?'off':''}" title="Toque para mostrar ou esconder"><i style="background:${typeof s.cor==='function'?s.cor(1):s.cor}"></i>${s.nome}</span>`).join('')}</div>${todas.length>1?'<div class="lgdica">Toque nos nomes para mostrar ou esconder no gráfico</div>':''}`)+`<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg><div class="tip"></div></div>`;
  el.querySelectorAll('[data-lg]').forEach(b=>b.onclick=()=>{const k=b.dataset.lg;if(oc.has(k))oc.delete(k);else if(todas.filter(s=>!oc.has(s.nome)).length>1)oc.add(k);chart(el,...el._args)});
  const svg=el.querySelector('svg'),tip=el.querySelector('.tip'),cur=svg.querySelector('#cur');
  const mv=ev=>{const r=svg.getBoundingClientRect(),x=(ev.clientX-r.left)*W/r.width,i=Math.max(0,Math.min(n-1,Math.floor((x-pl)/cw)));
    cur.setAttribute('x1',cx(i));cur.setAttribute('x2',cx(i));cur.setAttribute('visibility','visible');

  const mostra=()=>{const q=tira(inp.value).trim();if(!q){sug.style.display='none';return}
    res=INDICE.map(x=>{const t=tira(x.ticker),n=tira(x.nome);return[t.startsWith(q)?0:t.includes(q)?1:n.startsWith(q)?2:n.includes(q)?3:9,x]}).filter(a=>a[0]<9).sort((a,b)=>a[0]-b[0]).slice(0,8).map(a=>a[1]);sel=0;

// ---------- series mensais ----------
const mesK=d=>d.slice(0,7);
function precoMes(){const o={};A.cotacao.forEach(r=>o[mesK(r[0])]=r[4]);return o}
function provMes(){const o={};A.proventos.forEach(p=>{const k=mesK(p.data_com);o[k]=(o[k]||0)+p.valor});return o}
const provInicio=()=>A.proventos.length?A.proventos[A.proventos.length-1].data_com:null;
// retorno total mensal do ativo: cotacao + proventos reinvestidos no mes da data com
function retornoTotal(){const pm=precoMes(),dm=provMes(),ks=Object.keys(pm).sort(),o={};let v=100;ks.forEach((k,i)=>{if(i)v*=(pm[k]+(dm[k]||0))/pm[ks[i-1]];o[k]=v});return o}
function acumula(tx,ks){const o={};let v=100;ks.forEach((k,i)=>{if(i){if(!isNum(tx[k])){v=null}else if(v!=null)v*=1+tx[k]/100}o[k]=v});return o}
const rotM=k=>MES[+k.slice(5,7)-1]+'/'+k.slice(2,4);
const CMP_CORES={ativo:'var(--c1)',CDI:'var(--c2)',IPCA:'var(--c3)',IBOV:'var(--c4)',IFIX:'var(--c5)',SMLL:'var(--c6)',IDIV:'var(--c7)',IVVB11:'var(--c8)'};
function serieCmp(anos){
  const tr=retornoTotal(),todos=Object.keys(tr).sort(),fim=todos[todos.length-1];
  let ini=`${+fim.slice(0,4)-anos}-${fim.slice(5,7)}`;
  const pi=A.tipo==='fii'&&provInicio()?mesK(provInicio()):null; // FII: so a partir do primeiro rendimento conhecido
  let cortado=false;if(pi&&ini<pi){ini=pi;cortado=true}if(ini<todos[0]){ini=todos[0];cortado=true}
  const ks=todos.filter(k=>k>=ini),base=v=>v==null?null:v;
  const norm=o=>{const b=o[ks[0]];return ks.map(k=>isNum(o[k])&&isNum(b)?(o[k]/b-1)*100:null)};
  const S=[{id:'ativo',nome:A.ticker,vals:norm(tr)}];
  if(IX){S.push({id:'CDI',nome:'CDI',vals:norm(acumula(IX.cdi_mes,ks))},{id:'IPCA',nome:'IPCA',vals:norm(acumula(IX.ipca_mes,ks))});
    ['IBOV','IFIX','SMLL','IDIV','IVVB11'].forEach(x=>{const m=IX.mensal[x]||{};if(m[ks[0]]!=null)S.push({id:x,nome:x,vals:norm(m)})})}
  return{ks,S,cortado};
}

  if(!el._ini){el._ini=1;el._ocultas=new Set(A.tipo==='fii'?['SMLL','IDIV','IVVB11']:A.tipo==='bdr'?['IFIX','SMLL','IDIV']:['IFIX','SMLL','IVVB11'])}

// ---------- termometro do proprio historico ----------
function termDados(){
  const anos=+st.trm,out=[];
  const linha=(nome,k,atual,vals,fmt,desde)=>{vals=vals.filter(isNum);if(!isNum(atual)||vals.length<3)return;const mn=Math.min(...vals,atual),mx=Math.max(...vals,atual),md=vals.reduce((s,x)=>s+x,0)/vals.length;out.push({nome,k,atual,mn,mx,md,pct:Math.round(100*vals.filter(x=>x<atual).length/vals.length),n:vals.length,fmt,desde})};
  if(A.tipo==='fii'){const ms=Object.keys(A.mensal).sort(),cut=`${+ms[ms.length-1].slice(0,4)-anos}-${ms[ms.length-1].slice(5)}`,mm=ms.filter(m=>m>cut);
    linha('P/VP','pvp',A.indicadores.pvp,mm.map(m=>A.mensal[m].pvp),F.x,mm[0]);
    const pm=precoMes(),pi=provInicio(),dm=provMes(),dy=[];Object.keys(pm).sort().forEach(m=>{if(m<=cut||!pi)return;const a=`${+m.slice(0,4)-1}-${m.slice(5)}`;if(a<mesK(pi))return;let s=0;Object.keys(dm).forEach(x=>{if(x>a&&x<=m)s+=dm[x]});dy.push(s/pm[m]*100)});
    linha('Dividend Yield (12M)','dy',A.indicadores.dy,dy.slice(0,-1),F.p,null);
    linha('Rendimento por cota (mês)','ultimo_rendimento',A.indicadores.ultimo_rendimento,mm.map(m=>A.mensal[m].rend),v=>brl3(v),mm[0]);
  }else{const h=A.hist_indicadores,ys=Object.keys(h).sort().slice(-anos);
    [['P/L','pl',v=>v>0],['P/VP','pvp',v=>v>0],['Dividend Yield','dy',v=>v>=0],['EV/EBIT','ev_ebit',v=>v>0],['ROE','roe',()=>1],['Margem líquida','margem_liquida',()=>1]].forEach(([n,k,ok])=>{
      const f=['dy','roe','margem_liquida'].includes(k)?F.p:F.x;linha(n,k,ok(A.indicadores[k])?A.indicadores[k]:null,ys.map(y=>h[y][k]).filter(v=>isNum(v)&&ok(v)),f,ys[0])})}
  return out;
}

// ---------- quedas e tempo de recuperacao ----------
function quedas(){
  const pi=A.tipo==='fii'?provInicio():null,dv={};A.proventos.forEach(p=>dv[p.data_com]=(dv[p.data_com]||0)+p.valor);
  const c=A.cotacao.filter(r=>!pi||r[0]>=pi);let v=100,top=100,topD=c[0][0];const pts=[],ep=[];let cur=null;
  c.forEach((r,i)=>{if(i)v*=(r[4]+(dv[c[i-1][0]]||0))/c[i-1][4];
    if(v>=top){if(cur){cur.rec=r[0];ep.push(cur);cur=null}top=v;topD=r[0]}
    const dd=(v/top-1)*100;if(dd<0){if(!cur)cur={pico:topD,fundo:r[0],q:dd};if(dd<cur.q){cur.q=dd;cur.fundo=r[0]}}pts.push([r[0],dd])});
  if(cur)ep.push(cur);
  return{pts,ep:ep.filter(e=>e.q<=-10).sort((a,b)=>a.q-b.q),desde:c[0][0],atual:pts[pts.length-1][1]};
}
const mesesEntre=(a,b)=>Math.max(0,Math.round((new Date(b)-new Date(a))/2629800000));
const tempo=m=>m<1?'menos de 1 mês':m<24?m+(m>1?' meses':' mês'):N1.format(m/12)+' anos';
function desenharDd(){
  const el=$('#gDd');if(!el)return;const Q=quedas(),fim=Q.pts[Q.pts.length-1][0];
  const ini=st.dd==='max'?'0':`${+fim.slice(0,4)-(+st.dd)}${fim.slice(4)}`;const p=Q.pts.filter(x=>x[0]>=ini),pas=Math.max(1,Math.floor(p.length/400)),s=p.filter((x,i)=>i%pas===0||i===p.length-1);
  chart(el,s.map(x=>MES[+x[0].slice(5,7)-1]+'/'+x[0].slice(2,4)),[{nome:'Queda desde o topo',tipo:'linha',cor:'var(--up)',vals:s.map(x=>x[1]),fmt:v=>N1.format(v)+'%',w:1.6}],{fmtE:v=>N0.format(v)+'%',legenda:false,rotTip:i=>dBR(s[i][0]),ticks:8});
  const top=Q.ep.slice(0,5),mx=top[0];
  $('#ddBox').innerHTML=`<div><span>Maior queda</span><b class="neg">${mx?N1.format(mx.q)+'%':'-'}</b><small>${mx?`de ${dBR(mx.pico)} a ${dBR(mx.fundo)}`:''}</small></div><div><span>Tempo para voltar ao topo</span><b>${mx?(mx.rec?tempo(mesesEntre(mx.fundo,mx.rec)):'ainda não voltou'):'-'}</b><small>${mx&&mx.rec?'depois do fundo, em '+dBR(mx.rec):''}</small></div><div><span>Hoje</span><b class="${Q.atual<-0.5?'neg':'pos'}">${Q.atual<-0.5?N1.format(Q.atual)+'% abaixo do topo':'no topo'}</b><small>${A.tipo==='fii'?'rendimentos':'proventos'} reinvestidos</small></div>`;
  $('#ddTab').innerHTML=top.length?`<table class="t num"><thead><tr><th>Topo</th><th>Fundo</th><th class="r">Queda</th><th class="r">Caindo por</th><th class="r">Recuperação</th></tr></thead><tbody>${top.map(e=>`<tr><td>${dBR(e.pico)}</td><td>${dBR(e.fundo)}</td><td class="r neg">${N1.format(e.q)}%</td><td class="r">${tempo(mesesEntre(e.pico,e.fundo))}</td><td class="r">${e.rec?tempo(mesesEntre(e.fundo,e.rec)):'ainda não voltou'}</td></tr>`).join('')}</tbody></table>`:'<p class="note">Nenhuma queda de 10% ou mais no período.</p>';
  $('#ddNota').textContent=`Considera a cotação com os ${A.tipo==='fii'?'rendimentos':'proventos'} reinvestidos, desde ${dBR(Q.desde)}. A tabela lista as maiores quedas de 10% ou mais.`;
}

// ---------- renda x inflacao e yield on cost ----------
function desenharRenda(){
  const el=$('#gRenda');if(!el)return;const pi=provInicio();if(!pi){el.innerHTML='<p class="note">Sem proventos no histórico.</p>';return}
  const ip={};let v=1;const ipm=(IX&&IX.ipca_mes)||{};Object.keys(ipm).sort().forEach(k=>{v*=1+ipm[k]/100;ip[k]=v});const ipK=Object.keys(ip).sort(),ipU=ip[ipK[ipK.length-1]];
  const fator=d=>{const k=mesK(d);const kk=ipK.filter(x=>x<=k).pop();return kk&&ipU?ipU/ip[kk]:null};
  const ult=A.fechamento,y0=Math.max(+pi.slice(0,4)+(pi.slice(5,7)>'01'?1:0),ipK.length?+ipK[0].slice(0,4):9999),yN=+ult.slice(0,4)-1,anos=[];for(let y=Math.max(y0,yN-(A.tipo==='fii'?9:14));y<=yN;y++)anos.push(y);
  const nom={},real={};A.proventos.forEach(p=>{const y=+p.data_com.slice(0,4),f=fator(p.data_com);nom[y]=(nom[y]||0)+p.valor;if(f)real[y]=(real[y]||0)+p.valor*f});
  const a12=`${+ult.slice(0,4)-1}${ult.slice(4)}`,p12=A.proventos.filter(p=>p.data_com>a12),n12=p12.reduce((s,p)=>s+p.valor,0),r12=p12.reduce((s,p)=>s+p.valor*(fator(p.data_com)||1),0);
  const lb=[...anos.map(String),'Últ. 12M'];
  chart(el,lb,[{nome:'Valor pago (R$ por '+(A.tipo==='fii'?'cota':'ação')+')',tipo:'barra',cor:'var(--c5)',vals:[...anos.map(y=>nom[y]||0),n12],fmt:v=>brl3(v)},{nome:'Corrigido pela inflação (R$ de hoje)',tipo:'barra',cor:'var(--c3)',vals:[...anos.map(y=>isNum(real[y])?real[y]:nom[y]?null:0),r12],fmt:v=>brl3(v)}],{fmtE:v=>N2.format(v),destaque:anos.length});
  // yield on cost: quem comprou no comeco de cada ano
  const c=A.cotacao,lin=[];for(let y=Math.max(+c[0][0].slice(0,4),+ult.slice(0,4)-10);y<=+ult.slice(0,4);y++){const r=c.find(x=>x[0]>=y+'-01-01');if(!r)continue;const yoc=n12/r[4]*100;lin.push([y,r,yoc,10000/r[4]*n12/12])}
  $('#yocTab').innerHTML=`<table class="t num"><thead><tr><th>Comprou em</th><th class="r">Preço pago</th><th class="r">Renda hoje<br><small>sobre o preço pago</small></th><th class="r">R$ 10 mil rendem<br><small>por mês, hoje</small></th></tr></thead><tbody>${lin.reverse().map(([y,r,yoc,m])=>`<tr><td>jan/${y}</td><td class="r">${brl(r[4])}</td><td class="r"><b>${N2.format(yoc)}% a.a.</b></td><td class="r">${brl(m)}</td></tr>`).join('')}</tbody></table>`;
  $('#rendaNota').textContent=`Inflação pelo IPCA até ${IX&&ipK.length?mesBR(ipK[ipK.length-1]):'-'}. "Renda hoje" usa os ${A.tipo==='fii'?'rendimentos':'proventos'} dos últimos 12 meses (${brl3(n12)} por ${A.tipo==='fii'?'cota':'ação'}). Preço pago corrigido por desdobramentos.${A.tipo==='fii'?' Rendimentos com histórico desde '+mesBR(mesK(pi))+'.':''}`;
}

// ---------- rosca da carteira (FII) ----------
function desenharRosca(){
  const el=$('#gCart');if(!el)return;const it=A.composicao.itens.slice().sort((a,b)=>b[1]-a[1]),t=it.reduce((s,x)=>s+x[1],0),cores=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','var(--c7)','var(--c8)'];
  let a=-Math.PI/2,arc='';const R=90,r=58,cx=110,cy=110;
  it.forEach(([n,v],i)=>{const f=v/t,b=a+f*Math.PI*2,lg=f>.5?1:0,p=(ang,rad)=>[cx+rad*Math.cos(ang),cy+rad*Math.sin(ang)];const[x1,y1]=p(a,R),[x2,y2]=p(b-1e-4,R),[x3,y3]=p(b-1e-4,r),[x4,y4]=p(a,r);
    arc+=`<path d="M${x1} ${y1}A${R} ${R} 0 ${lg} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${lg} 0 ${x4} ${y4}Z" fill="${cores[i%8]}" stroke="var(--s)" stroke-width="2"><title>${n}: ${N1.format(f*100)}%</title></path>`;a=b});
  el.innerHTML=`<div class="rosca"><svg viewBox="0 0 220 220" role="img" aria-label="Composição da carteira">${arc}<text x="110" y="104" text-anchor="middle" font-size="12" fill="var(--mu)">Total</text><text x="110" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="var(--fg)">${grande(t,'R$').replace(/ (Bilhões|Bilhão)/,' bi').replace(/ (Milhões|Milhão)/,' mi')}</text></svg>
    <div class="rl">${it.map(([n,v],i)=>`<div><i style="background:${cores[i%8]}"></i><span>${n}</span><b class="num">${N1.format(v/t*100)}%</b></div>`).join('')}</div></div><p class="note">Último informe mensal entregue à CVM (${mesBR(A.composicao.data)}). Percentual sobre o total de ativos do fundo.</p>`;
}

// ---------- secoes ----------
function secExtrasGraf(){
  const anosCmp=[['1','1A'],['2','2A'],['5','5A'],['10','10A']];
  return sec('gcmp','Comparação de '+A.ticker+' com índices',seg('cmp',anosCmp,'cmp'),`<div id="gCmp"></div><div class="calc"><span>Se você tivesse investido</span><input id="cmpV" inputmode="decimal" value="1.000,00" aria-label="Valor investido"><span>em ${A.ticker} há</span><select class="sel" id="cmpA">${anosCmp.map(([v])=>`<option value="${v}" ${v===st.cmp?'selected':''}>${v} ${v==='1'?'ano':'anos'}</option>`).join('')}</select><span id="cmpDesde" class="note" style="margin:0"></span><span id="cmpRes"></span></div><div class="cmpg" id="cmpCalc"></div><p class="note" id="cmpNota"></p>`)
  +sec('gterm','Termômetro: hoje comparado ao próprio histórico',seg('trm',[['5','5A'],['10','10A']],'trm'),`<p class="note" style="margin:0 0 6px">O traço grande é o valor de hoje e o pequeno é a média; a barra vai do menor ao maior valor do próprio ${A.tipo==='fii'?'fundo':'ativo'} no período. Não diz se é hora de comprar ou vender: só mostra se o número está alto ou baixo para o padrão dele.</p><div id="gTerm"></div>`)
  +sec('gdd','Quanto caiu e quanto demorou para voltar',seg('dd',[['5','5A'],['10','10A'],['max','MAX']],'dd'),`<div class="box2 b3" id="ddBox" style="margin:0 0 12px"></div><div id="gDd"></div><div class="tw" id="ddTab" style="margin-top:12px"></div><p class="note" id="ddNota"></p>`)
  +sec('grenda','Renda x inflação',``,`<p class="note" style="margin:0 0 6px">${A.tipo==='fii'?'Rendimentos':'Proventos'} pagos por ${A.tipo==='fii'?'cota':'ação'} em cada ano, no valor da época e corrigidos pela inflação até hoje. Quando a barra corrigida diminui com o tempo, a renda não acompanhou a inflação.</p><div id="gRenda"></div><h3 style="font-size:16px;margin:18px 0 4px">Quem comprou em cada ano recebe hoje</h3><div class="tw" id="yocTab"></div><p class="note" id="rendaNota"></p>`);
}
const EXTRA={cmp:desenharCmp,trm:desenharTerm,dd:desenharDd,com:desenharCom,renda:desenharRenda,rosca:desenharRosca};
function ligarExtras(){
  const v=$('#cmpV'),a=$('#cmpA');if(v){v.oninput=calcCmp;v.onblur=()=>{const x=parseFloat(String(v.value).replace(/\./g,'').replace(',','.'))||0;v.value=N2.format(x);calcCmp()};a.onchange=calcCmp}
  ['com','cmp','trm','dd','renda'].forEach(k=>EXTRA[k]());if(A.tipo==='fii')desenharRosca();
